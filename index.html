<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


<title>PA#1</title>
<style>
    body {
        background-color: #EEEEEE;
    }
</style>

<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>
<script src="./shader.gpu"></script>
<script src="./model.js"></script>
<script src="./main.js"></script>

</head>
<body onload="init()">

<h2>A Corrugated Sphere with "Trackball" Mouse Rotation</h2>

<p id="message">Drag your mouse on the surface  to rotate it.<br>
(On a touch screen, you can use your finger.)</p>


<div id="canvas-holder">
   <canvas width="600" height="600" id="webglcanvas" style="background-color:red"></canvas>
   <div style="margin-top: 15px; color: blue;">
        <label>U Granularity: 
            <input type="range" id="uSlider" min="10" max="150" value="60" oninput="document.getElementById('uVal').innerText = this.value">
            <span id="uVal">60</span>
        </label>
        <br><br>
        <label>V Granularity: 
            <input type="range" id="vSlider" min="10" max="150" value="60" oninput="document.getElementById('vVal').innerText = this.value">
            <span id="vVal">60</span>
        </label>
    </div>
</div>


</body></html>
